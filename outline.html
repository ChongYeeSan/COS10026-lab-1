<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>A Sample Form</h1>
    <hr>

    <h2>Survey Form</h2>
    <form method ="post" action = "https://mercury.swin.edu.au/it000000/form.php">
        <fieldset>
            <legend>Pesonal Details</legend>
            <p>
                <label for="fname">First Name:</label>
                <!-- more than one name you have to add a space between them. The name should be between 2 and 20 characters long. -->
                <input type="text" name="fname" id ="fname" pattern="[a-zA-Z ]{2,20}">
            </p>

            <p> Gender: <br>
            <!-- technique 1 to addocieate label and input: use for attribute-->
             <label for="male">Male</label>
             <input type = "radio" name="gender" id="male" value="M">

             <label for="female">Female</label>
             <input type ="radio" name ="gender" id="female" value="F">

             <!-- technique 2 to associate label and input: nest input inside label -->
            <label>Other <input type="radio" name="gender" id="other" value="O"></label>

            </p>
        <!-- grouping set -->
        </fieldset> 

        <p>Things you like about the seminar <br> 
            <label for="loc">Location</label>
            <input type="checkbox" name="things[]" id="loc" value="location">

            <label for="fod">Food</label>
            <input type="checkbox" name="things[]" id="fod" value="food">

            <label for="spe">Speaker</label>
            <input type="checkbox" name="things[]" id="spe" value="speaker">
        </p>

        <p><label for ="rk"> How would you like to rank the seminar?</label>
            <select name="rank" id="rk">
                <option value="3" selected>Excellent</option>
                <option value="2" selected>Good</option>
                <option value="1" selected>Poor</option>          
            </select>
        </p>

        <p><label>Comments 
            <br>
            <textarea name="comments" rows="4" cols="20">
                Enter your comments here.
            </textarea>
        </label></p>

        <input type="submit" value="Submit Now">
        </form>

</body>
</html>
